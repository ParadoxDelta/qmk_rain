name: Build Keychron Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies & ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi dfu-util
          python3 -m pip install qmk

      - name: Compile Firmware
        run: |
          qmk compile -kb keychron/k2_he/ansi -km keychron

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: keychron_k2_he_firmware
          path: "*.bin"
